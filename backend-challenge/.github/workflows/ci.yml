name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend-challenge/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend-challenge/**'

defaults:
  run:
    working-directory: backend-challenge

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-challenge/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend-challenge

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orderdb_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/orderdb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-challenge/go.sum
      - run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend-challenge/coverage.out
          flags: backend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-challenge/go.sum
      - run: go vet ./...
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./...

  build:
    name: Build
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-challenge/go.sum
      - run: go build -o bin/server ./cmd/server/
      - name: Docker build
        run: docker build -t order-food-api .
