version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - gocritic
    - ineffassign
    - unused
    - misspell
    - prealloc
    - revive

linters-settings:
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        severity: warning
  gosec:
    excludes:
      - G104 # Unhandled errors in deferred calls

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
